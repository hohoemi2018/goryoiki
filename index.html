<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>五領域アセスメント整理アプリ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#FFF8F4; --dot:#F6E4DE; --surface:#FFFFFF; --surface-2:#FFFBF8;
  --ink:#57464F; --ink-soft:#7A6770; --line:#F0DDD8; --line-strong:#E6C8C1;
  --pink:#F8C3CF; --pink-deep:#B6496C; --pink-soft:#FFEFF3;
  --mint:#C7EBD6; --mint-deep:#2E7A55; --mint-soft:#EEFAF2;
  --lav:#DDD3F5; --lav-deep:#6650A6; --lav-soft:#F5F1FD;
  --sky:#CFE5F8; --sky-deep:#2C6A9E; --sky-soft:#EEF6FD;
  --peach:#FFDCC0; --peach-deep:#A2561C; --peach-soft:#FFF3E8;
  --sun:#FFEBA6; --sun-deep:#8A6A00; --sun-soft:#FFF9E0;
  --coral:#FFD3C9; --coral-deep:#B24A36; --coral-soft:#FFEDE8;
  --gray:#E4E0EC; --gray-deep:#5F5873; --gray-soft:#F4F2F8;
  --r-l:22px; --r-m:14px; --r-s:10px;
  --shadow:0 8px 22px -12px rgba(150,90,100,.35);
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic","Meiryo",sans-serif;
  --f-disp:"Kiwi Maru","Zen Maru Gothic","Hiragino Maru Gothic ProN","Meiryo",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; font-family:var(--f-body); color:var(--ink); font-size:16px; line-height:1.75;
  background-color:var(--bg);
  background-image:radial-gradient(var(--dot) 1.3px, transparent 1.4px);
  background-size:22px 22px;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--f-disp);font-weight:500;line-height:1.4;text-wrap:balance;margin:0}
p{margin:0}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--pink-deep);outline-offset:2px;border-radius:8px}

/* ---------- header ---------- */
.hero{position:relative;background:linear-gradient(180deg,#FFE4EA 0%,#FFEEDF 70%,#FFF4E6 100%);padding-top:env(safe-area-inset-top,0px)}
.hero-inner{display:flex;align-items:center;gap:20px;padding-block:22px 34px}
.hero-text{flex:1;min-width:0}
.hero-eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:13px;letter-spacing:.08em;color:var(--pink-deep);background:rgba(255,255,255,.7);padding:3px 12px;border-radius:999px;margin-bottom:10px}
.hero h1{font-size:clamp(24px,4.4vw,36px);letter-spacing:.04em;color:#5A3F4C}
.hero-sub{margin-top:6px;font-size:15px;color:var(--ink-soft)}
.hero-art{flex:0 0 auto;width:min(240px,34vw)}
.hero-art svg{display:block;width:100%;height:auto}
.hero-wave{position:absolute;left:0;right:0;bottom:-1px;height:26px;display:block;width:100%}

/* ---------- nav ---------- */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,248,244,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;gap:8px;padding-block:10px;overflow-x:auto;scrollbar-width:none}
.nav .wrap::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;border:2px solid transparent;background:transparent;border-radius:999px;padding:7px 16px;font-weight:700;font-size:15px;color:var(--ink-soft);cursor:pointer}
.tab svg{width:20px;height:20px}
.tab:hover{background:var(--surface)}
.tab[aria-current="page"]{background:var(--surface);border-color:var(--pink);color:var(--ink);box-shadow:0 3px 0 var(--pink)}
.tab .count{font-size:12px;background:var(--pink-soft);color:var(--pink-deep);border-radius:999px;padding:0 8px;font-variant-numeric:tabular-nums}

main{padding-block:22px 120px}

/* ---------- common parts ---------- */
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-l);box-shadow:var(--shadow);padding:22px}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--ink-soft)}
.small{font-size:13.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;border:2px solid var(--line-strong);background:var(--surface);padding:9px 18px;font-weight:700;font-size:15px;cursor:pointer;line-height:1.3;text-decoration:none;color:var(--ink);transition:transform .08s ease, box-shadow .08s ease}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn svg{width:18px;height:18px;flex:0 0 auto}
.btn-main{background:var(--pink);border-color:#EFA8B8;box-shadow:0 4px 0 #E79DB0;color:#4A3440}
.btn-main:hover{background:#F6B6C4}
.btn-main:active{box-shadow:0 2px 0 #E79DB0;transform:translateY(2px)}
.btn-mint{background:var(--mint);border-color:#A9DDBE;box-shadow:0 4px 0 #9CD3B3;color:#2B4A3A}
.btn-mint:hover{background:#B9E5CB}
.btn-sun{background:var(--sun);border-color:#F3D878;box-shadow:0 4px 0 #EDCF6A;color:#4F4210}
.btn-big{font-size:17px;padding:13px 26px}
.btn-sm{font-size:13.5px;padding:5px 12px;border-width:1.5px}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:var(--pink-soft)}
.btn-danger{color:var(--coral-deep);border-color:var(--coral)}
.btn-danger:hover{background:var(--coral-soft)}
.linkish{background:none;border:none;padding:0;color:var(--pink-deep);font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer}

.banner{display:flex;gap:14px;align-items:flex-start;border-radius:var(--r-m);padding:14px 16px;background:var(--sun-soft);border:1.5px dashed #F1D884}
.banner svg{flex:0 0 auto;width:40px;height:40px}
.banner.mint{background:var(--mint-soft);border-color:#AEDDC2}
.banner.pink{background:var(--pink-soft);border-color:#F2B3C2}

/* ---------- form ---------- */
.sec-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.num{flex:0 0 auto;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-disp);font-size:18px;color:#fff}
.sec-head h2{font-size:21px}
.sec-head p{font-size:13.5px;color:var(--ink-soft)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 18px}
.span2{grid-column:span 2}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > label, .field > .lbl{font-weight:700;font-size:15px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.field .hint{font-weight:400;font-size:12.5px;color:var(--ink-soft)}
.req{font-size:11.5px;background:var(--pink);color:#4A3440;border-radius:6px;padding:0 6px;font-weight:700}
input[type=text],input[type=date],select,textarea{width:100%;border:2px solid var(--line);background:#FFFDFC;border-radius:12px;padding:10px 12px;font-size:16px;line-height:1.6;outline:none;transition:border-color .12s, box-shadow .12s}
textarea{min-height:92px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#E9A2B5;box-shadow:0 0 0 4px var(--pink-soft)}
input::placeholder,textarea::placeholder{color:#B8A5AC}
.period{display:flex;align-items:center;gap:8px}
.period span{flex:0 0 auto}
.err{color:var(--coral-deep);font-size:13.5px;font-weight:700}
.field.has-err input{border-color:#E7907C}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;display:inline-flex}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:#FFFDFC;border-radius:999px;padding:6px 14px 6px 10px;font-size:15px;font-weight:500;cursor:pointer;transition:all .12s}
.chip span::before{content:"";width:16px;height:16px;border-radius:50%;border:2px solid var(--line-strong);background:#fff;flex:0 0 auto;transition:all .12s}
.chip input:checked + span{background:var(--pink-soft);border-color:#EFA8B8;font-weight:700}
.chip input:checked + span::before{background:var(--pink-deep);border-color:var(--pink-deep);box-shadow:inset 0 0 0 3px #fff}
.chip input:focus-visible + span{outline:3px solid var(--pink-deep);outline-offset:2px}
.chip.sup input:checked + span{background:var(--mint-soft);border-color:#9FD6B7}
.chip.sup input:checked + span::before{background:var(--mint-deep);border-color:var(--mint-deep)}

.addbox{margin-top:14px;border:1.5px dashed #AEDDC2;border-radius:var(--r-m);background:var(--mint-soft);padding:14px}
.addbox summary{cursor:pointer;font-weight:700;color:var(--mint-deep);list-style:none;display:flex;align-items:center;gap:8px}
.addbox summary::-webkit-details-marker{display:none}
.addbox[open] summary{margin-bottom:12px}
.dom-inputs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.dom-inputs textarea{min-height:64px;font-size:15px}
.dlabel{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px}
.dlabel i{width:12px;height:12px;border-radius:50%;display:inline-block}

.tipbox{display:flex;gap:10px;align-items:flex-start;background:var(--sky-soft);border-radius:var(--r-m);padding:12px 14px;font-size:14px;color:#3F5566}
.tipbox svg{flex:0 0 auto;width:26px;height:26px}

.formbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(255,248,244,.95);backdrop-filter:blur(6px);border-top:1.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.formbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;flex-wrap:wrap}
.formbar .note{font-size:13px;color:var(--ink-soft);flex:1;min-width:200px}

/* ---------- result ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:18px}
.toolbar .left,.toolbar .right{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.printopt{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink-soft);cursor:pointer}
.printopt input{width:18px;height:18px;accent-color:var(--pink-deep)}

.sheet{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-l);box-shadow:var(--shadow);padding:26px 26px 30px;margin-bottom:22px;position:relative}
.sheet-tag{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.sheet-tag .pno{display:inline-flex;align-items:center;gap:10px}
.sheet-tag .pno b{font-family:var(--f-disp);font-weight:500;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:17px}
.sheet-tag h2{font-size:22px}
.sheet-tag .who{font-size:12.5px;color:var(--ink-soft)}
.sheet-lead{font-size:14px;color:var(--ink-soft);margin-bottom:16px}
.sub-h{display:flex;align-items:center;gap:8px;font-family:var(--f-disp);font-size:17px;margin:22px 0 10px}
.sub-h::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--pink);box-shadow:14px 0 0 var(--sun),28px 0 0 var(--mint);margin-right:30px}

.cover-title{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.cover-title svg{width:74px;height:74px;flex:0 0 auto}
.cover-title h2{font-size:25px}
.cover-title p{font-size:13.5px;color:var(--ink-soft)}
.info{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1.5px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.info div{padding:9px 14px;border-right:1.5px solid var(--line);border-bottom:1.5px solid var(--line);min-width:0}
.info div:nth-child(3n){border-right:none}
.info div:nth-last-child(-n+3){border-bottom:none}
.info dt{font-size:12px;color:var(--ink-soft);letter-spacing:.05em}
.info dd{margin:0;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.glance{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}
.glance .g{border-radius:var(--r-m);padding:14px 16px;min-width:0}
.glance .g h3{font-size:15px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.glance .g.full{grid-column:span 2}
.g-main{background:var(--lav-soft)}
.g-str{background:var(--sun-soft)}
.g-plan{background:var(--mint-soft)}
.g-sup{background:var(--sky-soft)}

.dchip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 12px 3px 4px;font-weight:700;font-size:14.5px;white-space:nowrap}
.dchip svg{width:24px;height:24px}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:1px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pill.s{background:var(--sun);color:#5A4600}
.pill.k{background:var(--coral);color:#7A2F20}
.pill.c{background:var(--gray);color:var(--gray-deep)}
.pill.n{background:#F3EEEE;color:var(--ink-soft)}
.pill.sup{background:var(--sky);color:#24506F}

/* check table */
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r-m);border:1.5px solid var(--line)}
table.ck{width:100%;border-collapse:collapse;min-width:600px;font-size:14.5px}
table.ck th,table.ck td{border-bottom:1.5px solid var(--line);padding:8px 10px;vertical-align:middle;text-align:left}
table.ck thead th{background:#FFF4F0;font-size:13px;letter-spacing:.05em;color:var(--ink-soft);font-weight:700;position:sticky;top:0}
table.ck thead th.m{text-align:center;width:72px}
table.ck tbody tr:last-child td{border-bottom:none}
table.ck td.dom{font-weight:700;width:128px;font-family:var(--f-disp);font-size:15px;line-height:1.45}
table.ck td.dom .di{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
table.ck td.dom svg{width:34px;height:34px}
table.ck td.vp .ev{display:block;font-size:12px;color:var(--ink-soft);line-height:1.5;margin-top:2px}
table.ck td.mk{text-align:center;padding:4px}
.mark{width:58px;height:34px;border-radius:999px;white-space:nowrap;border:2px dashed var(--line-strong);background:#fff;cursor:pointer;display:inline-grid;place-items:center;transition:all .12s;font-weight:700;font-size:12px;color:transparent}
.mark:hover{border-style:solid}
.mark[aria-pressed="true"]{border-style:solid;color:inherit}
.mark.s[aria-pressed="true"]{background:var(--sun);border-color:#EAC85A;color:#5A4600}
.mark.k[aria-pressed="true"]{background:var(--coral);border-color:#EFA592;color:#7A2F20}
.mark.c[aria-pressed="true"]{background:var(--gray);border-color:#C9C1D8;color:var(--gray-deep)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:13px;color:var(--ink-soft);margin-top:10px}
.point{margin-top:14px;display:flex;gap:10px;align-items:flex-start;background:var(--peach-soft);border-radius:var(--r-m);padding:12px 14px;font-size:14px}
.point b{flex:0 0 auto;font-family:var(--f-disp);font-weight:500;color:var(--peach-deep)}

/* key-value blocks */
.kv{display:grid;grid-template-columns:170px minmax(0,1fr);border:1.5px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.kv > .k{background:#FFF6F2;padding:10px 14px;font-weight:700;font-size:14.5px;border-bottom:1.5px solid var(--line)}
.kv > .v{padding:8px 12px;border-bottom:1.5px solid var(--line);min-width:0}
.kv > .k:nth-last-child(2),.kv > .v:last-child{border-bottom:none}
.kv2{grid-template-columns:130px minmax(0,1fr) 130px minmax(0,1fr)}
.kv2 > .k,.kv2 > .v{border-bottom:1.5px solid var(--line)}
.kv2 > .k:nth-last-child(-n+4),.kv2 > .v:nth-last-child(-n+3){border-bottom:none}

/* editable */
.ed{white-space:pre-wrap;overflow-wrap:anywhere;min-height:1.75em;padding:4px 6px;border-radius:8px;border:1.5px dashed transparent;outline:none;cursor:text}
.ed:hover{border-color:var(--line-strong);background:#FFFDFB}
.ed:focus{border-color:#E9A2B5;border-style:solid;background:#fff;box-shadow:0 0 0 3px var(--pink-soft)}
.ed:empty::before{content:attr(data-ph);color:#B8A5AC}
.edwrap{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.edwrap .ed{width:100%}
.reset{background:none;border:none;font-size:12px;color:var(--pink-deep);cursor:pointer;padding:0 6px;font-weight:700}
.edited-flag{font-size:11px;color:var(--ink-soft)}

/* domain memo cards */
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.dcard{border-radius:var(--r-m);border:1.5px solid;padding:14px 16px;min-width:0;break-inside:avoid}
.dcard.full{grid-column:span 2}
.dcard-h{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.dcard-h svg{width:38px;height:38px;flex:0 0 auto}
.dcard-h h3{font-size:17px;flex:1;min-width:0}
.dcard .lab{font-size:12.5px;font-weight:700;letter-spacing:.05em;margin-top:10px;margin-bottom:2px;display:flex;align-items:center;gap:6px}
.dcard .lab::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}

.confirm-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px;align-items:start}
.cbox{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:6px}
.cbox label{display:inline-flex;align-items:center;gap:8px;font-size:15px;cursor:pointer}
.cbox input{width:20px;height:20px;accent-color:var(--pink-deep);flex:0 0 auto}
.note-app{margin-top:14px;display:flex;gap:10px;align-items:flex-start;background:var(--lav-soft);border-radius:var(--r-m);padding:12px 14px;font-size:14px}
.note-app b{flex:0 0 auto;color:var(--lav-deep);font-family:var(--f-disp);font-weight:500}

table.fh{width:100%;border-collapse:collapse;min-width:640px;font-size:14.5px;table-layout:fixed}
table.fh th{background:#FFF4F0;font-size:13px;color:var(--ink-soft);padding:8px 10px;text-align:left;border-bottom:1.5px solid var(--line)}
table.fh th:nth-child(1){background:var(--peach-soft)}
table.fh th:nth-child(2){background:var(--sun-soft)}
table.fh th:nth-child(3){background:var(--lav-soft)}
table.fh th:nth-child(4){background:var(--mint-soft)}
table.fh td{vertical-align:top;padding:6px;border-bottom:1.5px solid var(--line);border-right:1.5px solid var(--line)}
table.fh td:last-child{border-right:none}
table.fh tr:last-child td{border-bottom:none}
.oneline{background:var(--mint-soft);border:2px solid #AEDDC2;border-radius:var(--r-m);padding:12px 14px;font-size:16.5px;font-weight:500}
.katachi{font-size:13px;color:var(--ink-soft);margin-bottom:6px}
.katachi span{display:inline-block;background:#fff;border:1.5px solid var(--line);border-radius:6px;padding:0 8px;margin-right:4px}

.p1-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
.p1-item{border-left:4px solid var(--peach);padding:2px 0 2px 10px;min-width:0}
.p1-item dt{font-size:12.5px;font-weight:700;color:var(--ink-soft)}
.p1-item dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px}

/* ---------- history ---------- */
.hist-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.hist-tools input,.hist-tools select{width:auto;flex:1 1 180px}
.hlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.hcard{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-l);padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-width:0}
.hcard-top{display:flex;align-items:flex-start;gap:12px}
.avatar{flex:0 0 auto;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-disp);font-size:19px;color:#5A3F4C}
.hcard h3{font-size:18px;overflow-wrap:anywhere}
.hmeta{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.hcard .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.empty{text-align:center;padding:30px 16px}
.empty svg{width:160px;height:auto;margin:0 auto 10px;display:block}
.backup{margin-top:26px}

/* ---------- supports ---------- */
.slist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.print-only{display:none}
.scard{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-l);padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0;transition:border-color .12s, background .12s}
.scard.on{border-color:#9FD6B7;background:linear-gradient(180deg,var(--mint-soft),#fff 60%)}
.scard-h{display:flex;align-items:flex-start;gap:10px}
.scard-h h3{font-size:17px;flex:1;min-width:0;overflow-wrap:anywhere}
.toggle{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13.5px;font-weight:700;color:var(--ink-soft)}
.toggle input{position:absolute;opacity:0;width:1px;height:1px}
.toggle .sw{width:46px;height:26px;border-radius:999px;background:#EADCD8;position:relative;transition:background .15s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .15s}
.toggle input:checked + .sw{background:#7CC59E}
.toggle input:checked + .sw::after{left:23px}
.toggle input:checked ~ .tlabel{color:var(--mint-deep)}
.toggle input:focus-visible + .sw{outline:3px solid var(--pink-deep);outline-offset:2px}
.scard .sdoms{display:flex;flex-wrap:wrap;gap:4px}
.scard details summary{cursor:pointer;font-size:14px;font-weight:700;color:var(--pink-deep)}
.scard details[open] summary{margin-bottom:10px}
.scard .dom-inputs{grid-template-columns:1fr}
.badge-custom{font-size:11.5px;background:var(--lav);color:#4B3A80;border-radius:6px;padding:0 6px;font-weight:700;margin-left:6px;vertical-align:middle;font-family:var(--f-body)}

/* ---------- modal & toast ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(87,70,79,.35);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border-radius:var(--r-l);padding:22px;max-width:420px;width:100%;box-shadow:0 20px 50px -20px rgba(87,70,79,.6);text-align:center}
.modal svg{width:70px;height:70px;margin:0 auto 8px;display:block}
.modal p{margin-bottom:16px}
.modal .row{justify-content:center}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#5A3F4C;color:#fff;padding:10px 18px;border-radius:999px;font-size:14.5px;z-index:60;box-shadow:0 10px 24px -10px rgba(0,0,0,.4);max-width:calc(100% - 32px);text-align:center}

footer.foot{text-align:center;font-size:12.5px;color:var(--ink-soft);padding-block:10px 30px}

@media (max-width:720px){
  .grid2,.grid3,.dom-inputs,.dgrid,.glance,.confirm-grid,.p1-grid,.hlist,.slist{grid-template-columns:1fr}
  .span2,.dcard.full,.glance .g.full{grid-column:auto}
  .info{grid-template-columns:repeat(2,minmax(0,1fr))}
  .info div:nth-child(3n){border-right:1.5px solid var(--line)}
  .info div:nth-child(2n){border-right:none}
  .info div:nth-last-child(-n+3){border-bottom:1.5px solid var(--line)}
  .info div:nth-last-child(-n+2){border-bottom:none}
  .kv,.kv2{grid-template-columns:1fr}
  .kv > .k{border-bottom:none;padding-bottom:2px}
  .kv2 > .k:nth-last-child(-n+4){border-bottom:none}
  .kv2 > .v:nth-last-child(-n+3){border-bottom:1.5px solid var(--line)}
  .kv2 > .v:last-child{border-bottom:none}
  .hero-inner{padding-block:16px 30px}
  .hero-art{width:112px}
  .hero-sub{font-size:13.5px}
  .sheet{padding:18px 16px 22px}
  .card{padding:18px 16px}
}

/* ---------- ブレインジム・BBA ---------- */
.safety{margin-top:14px;border:1.5px dashed var(--line-strong);border-radius:var(--r-m);padding:12px 14px;background:var(--surface-2)}
.safety .lbl{font-weight:700;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.safety .hint{font-weight:400;font-size:12.5px;color:var(--ink-soft)}
.dims{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
.dim{border:1.5px solid var(--line);border-radius:var(--r-m);padding:10px 12px;background:#fff;min-width:0}
.dim.top{border-color:var(--dc);background:var(--ds);box-shadow:0 3px 0 var(--dc)}
.dim-h{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
.dim-h b{font-family:var(--f-disp);font-weight:500;font-size:16px;color:var(--dd)}
.dim-q{font-size:13px;color:var(--ink-soft);margin-top:4px}
.session{background:var(--lav-soft);border:2px solid #D3C6F0;border-radius:var(--r-m);padding:10px 12px}
.bg-notes{margin:10px 0 0;padding-left:1.2em;font-size:13px;color:var(--ink-soft)}
.gcard{background:var(--surface);border:1.5px solid var(--line);border-top:6px solid var(--dc,var(--pink));border-radius:var(--r-l);padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.gcard-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.gcard-h h3{font-size:20px;color:var(--dd,var(--ink))}
.gmeta{display:grid;gap:4px;background:var(--ds,var(--surface-2));border-radius:var(--r-m);padding:10px 14px;font-size:14.5px}
.gmeta p{display:grid;grid-template-columns:9.5em minmax(0,1fr);gap:8px}
.gk{font-weight:700;font-size:12.5px;color:var(--ink-soft);padding-top:2px}
.gcols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:14px}
.gcols h4{font-size:15px;margin-bottom:8px;font-family:var(--f-disp);font-weight:500}
.glist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.glist.two{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px}
.glist li{display:flex;flex-direction:column;border-left:4px solid var(--dc,var(--pink));padding:2px 0 2px 10px;min-width:0}
.glist b{font-size:15px}
.glist span{font-size:13.5px;color:var(--ink-soft)}
.glist em{font-style:normal;font-size:12.5px;color:var(--coral-deep)}
.gsteps{margin:0 0 10px;padding-left:1.4em;display:grid;gap:6px}
.gsteps b{display:block;color:var(--pink-deep)}
.gcard.caution{--dc:var(--coral);--ds:var(--coral-soft)}
.print-only-block{display:none}
@media (max-width:720px){
  .dims,.gcols,.glist.two{grid-template-columns:1fr}
  .gmeta p{grid-template-columns:1fr;gap:0}
  .gcard{padding:16px}
}
@media print{
  .dims{gap:2mm;margin-bottom:3mm}
  .dim{padding:5px 8px}
  .dim-h b{font-size:10.5pt}
  .dim p{font-size:8.5pt}
  .session{padding:6px 8px;font-size:9.5pt;break-inside:avoid}
  .bg-notes{font-size:8.5pt}
  body.print-guide .print-only-block{display:block}
  body.print-guide .gcard{box-shadow:none;padding:4mm 5mm;font-size:9.5pt}
  body.print-guide .glist li{break-inside:avoid}
  body.print-guide .glist b{font-size:10pt}
  body.print-guide .glist span,body.print-guide .glist em{font-size:8.5pt}
  body.print-guide .gcard-h h3{font-size:13pt}
  body.print-guide .gmeta{font-size:9pt}
  body.print-guide .stack{gap:4mm}
}

/* ---------- 事業所 ---------- */
.facbar{background:rgba(255,255,255,.65);border-bottom:1px solid var(--line)}
.facbar .wrap{display:flex;align-items:center;gap:10px;padding-block:8px;flex-wrap:wrap}
.facbar-l{display:inline-flex;gap:6px;align-items:center;font-weight:700;font-size:14px;color:var(--ink-soft)}
.facbar-l svg{width:18px;height:18px}
.facbar select{width:auto;flex:1 1 220px;max-width:460px;padding:6px 10px;font-size:15px;font-weight:700;background:#fff}
.facnew{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
#f-fac + .facnew{margin-top:6px}
.facpick-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.facpick-row select{flex:1 1 260px;width:auto;min-width:0}
.modal-check{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--coral-soft);border-radius:var(--r-m);padding:10px 12px;margin:0 0 16px;cursor:pointer;font-size:15px}
.modal-check input{width:20px;height:20px;margin-top:2px;accent-color:var(--coral-deep);flex:0 0 auto}
.reset-card{border-color:var(--coral)}
.cover-fac{font-size:13.5px;color:var(--pink-deep);font-weight:700;letter-spacing:.04em;margin-bottom:2px}
.flist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.fcard{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-l);padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow)}
.fcard.on{border-color:#9FD6B7;background:linear-gradient(180deg,var(--mint-soft),#fff 60%)}
.fcard-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fcard-h svg{width:22px;height:22px;color:var(--mint-deep)}
.fcard-h b{font-family:var(--f-disp);font-weight:500;font-size:18px;overflow-wrap:anywhere}
@media (max-width:720px){ .facnew,.flist{grid-template-columns:1fr} .facbar select{max-width:none} }
@media print{ .cover-fac{font-size:10pt} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<body>

<script>

/* =========================================================

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const z2 = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${z2(d.getMonth() + 1)}-${z2(d.getDate())}`;
const todayISO = () => iso(new Date());
function addMonths(s, m){ const [y, mo, da] = s.split("-").map(Number); return iso(new Date(y, mo - 1 + m, da)); }
function fmtDate(s, dow = true){
  if (!s) return "";
  const [y, m, d] = String(s).split("-").map(Number);
  if (!y || !m || !d) return String(s);
  const w = "日月火水木金土"[new Date(y, m - 1, d).getDay()];
  return `${y}年${m}月${d}日${dow ? `（${w}）` : ""}`;
}
const fmtPeriod = (a, b) => (!a && !b) ? "" : `${fmtDate(a, false)} 〜 ${fmtDate(b, false)}`;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clone = o => JSON.parse(JSON.stringify(o));
const trunc = (s, n) => (s.length > n ? s.slice(0, n) + "…" : s);
const CE = (() => { try { const d = document.createElement("div"); d.contentEditable = "plaintext-only"; return d.contentEditable === "plaintext-only" ? "plaintext-only" : "true"; } catch (e) { return "true"; } })();

/* =========================================================

const defaultDb = () => ({
  settings:{ setupDone:false, selected:[...DEFAULT_SELECTED], custom:[], overrides:{}, recorder:"", printP1:false, facilities:[], currentFacility:"" },
  records:[], draft:null
});
let db = defaultDb();
function load(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const d = JSON.parse(raw), base = defaultDb();
      db = { ...base, ...d, settings:{ ...base.settings, ...(d.settings || {}) }, records:Array.isArray(d.records) ? d.records : [] };
    }
  } catch (e) { storageOK = false; }
}
function persist(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); storageOK = true; }
  catch (e) { storageOK = false; toast("この端末に保存できませんでした。ブラウザの設定を確認してください"); }
}
let saveTimer = null;
function persistSoon(){ clearTimeout(saveTimer); saveTimer = setTimeout(persist, 350); }

  });
  const cus = (db.settings.custom || []).map(c => ({ ...c, d:{ ...c.d }, custom:true }));
  return [...pres, ...cus];
}
const supMap = () => Object.fromEntries(allSupports().map(s => [s.id, s]));

/* =========================================================
   事業所
   ========================================================= */
const FAC_TYPES = ["放課後等デイサービス", "児童発達支援事業所", "多機能型（児童発達支援・放課後等デイサービス）", "その他"];
const facList = () => (Array.isArray(db.settings.facilities) ? db.settings.facilities : (db.settings.facilities = []));
const facById = id => facList().find(f => f.id === id) || null;
const curFac = () => facById(db.settings.currentFacility) || facList()[0] || null;
const facLabel = f => f ? `${f.type && f.type !== "その他" ? f.type + "　" : ""}${f.name}` : "";
const countRecs = id => db.records.filter(r => r.input.facilityId === id).length;
function recFac(rec){
  const f = facById(rec.input.facilityId);
  if (f) return f;
  return rec.input.facilityName ? { id:rec.input.facilityId || "", name:rec.input.facilityName, type:rec.input.facilityType || "" } : null;
}
function addFacility(name, type){
  name = String(name || "").trim(); if (!name) return null;
  const ex = facList().find(f => f.name === name);
  if (ex) { if (type && !ex.type) ex.type = type; return ex; }
  const first = facList().length === 0;
  const f = { id:"f_" + uid(), name, type:type || "", recorder:"" };
  facList().push(f);
  /* はじめての登録のときは、それまでの記録をこの事業所に入れる */
  if (first) db.records.forEach(r => { if (!r.input.facilityId) { r.input.facilityId = f.id; r.input.facilityName = f.name; r.input.facilityType = f.type; } });
  if (first || !facById(db.settings.currentFacility)) db.settings.currentFacility = f.id;
  return f;
}

/* =========================================================
   下書き
   ========================================================= */
function newDraft(base = {}){
  const t = todayISO(), f = curFac();
  return { id:null, name:"", date:t, periodStart:t, periodEnd:addMonths(t, 1), age:"", recorder:(f && f.recorder) || db.settings.recorder || "",
    facilityId:f ? f.id : "", newFacName:"", newFacType:"",
    scenes:[], sceneOther:"", supports:[...db.settings.selected], safetySeizure:false, safetyEar:false,
    when:"", before:"", behavior:"", after:"", wishChild:"", wishFamily:"", strengths:"", difficulties:"", conditions:"", ...base };
}
const draftHasContent = d => !!(d && (String(d.name || "").trim() || TEXT_FIELDS.some(f => String(d[f.key] || "").trim())));

/* =========================================================
   自動整理（キーワード判定）
   ========================================================= */
function sentences(text){
  /* 。！？で区切る（「」や（）の中では区切らない） */
  const out = []; let buf = "", depth = 0;
  for (const ch of String(text || "")) {
    if ("「『（(【".includes(ch)) depth++;
    else if ("」』）)】".includes(ch)) depth = Math.max(0, depth - 1);
    if (ch === "\n") { if (buf.trim()) out.push(buf.trim()); buf = ""; depth = 0; continue; }
    buf += ch;
    if (depth === 0 && "。！？!?".includes(ch)) { if (buf.trim()) out.push(buf.trim()); buf = ""; }
  }
  if (buf.trim()) out.push(buf.trim());
  return out;
}
function polarity(sent, mode){
  if (mode === "pos") return "pos";
  if (mode === "neg") return "neg";
  let rest = sent, neg = 0, pos = 0;
  NEUTRAL_WORDS.forEach(c => { rest = rest.split(c).join("＿"); });
  PRE_POS.forEach(c => { if (rest.includes(c)) { pos++; rest = rest.split(c).join("＿"); } });
  NEG_CUES.forEach(c => { if (rest.includes(c)) { neg++; rest = rest.split(c).join("＿"); } });
  if (mode === "wish") return neg ? "neg" : "neu";   /* 意向は「〜したい」なので強みにはしない */
  POS_CUES.forEach(c => { if (rest.includes(c)) pos++; });
  if (neg && !pos) return "neg";
  if (pos && !neg) return "pos";
  if (pos && neg) return "mix";
  return "neu";
}
const FIELD_PRIORITY = ["difficulties", "strengths", "behavior", "conditions", "after", "before", "when", "wishChild", "wishFamily"];
/* 手がかりの言葉のまわりだけを短く見せる */
function snippet(e, n = 30){
  const t = e.t, i = e.k ? t.indexOf(e.k) : -1;
  if (t.length <= n || i < 0) return trunc(t, n);
  let a = Math.max(0, i - 10), b = Math.min(t.length, a + n);
  a = Math.max(0, b - n);
  return (a > 0 ? "…" : "") + t.slice(a, b) + (b < t.length ? "…" : "");
}
function analyze(input){
  const res = {};
  VPS.forEach(v => { res[v.id] = { pos:[], neg:[], neu:[] }; });
  TEXT_FIELDS.forEach(f => {
    sentences(input[f.key]).forEach(s => {
      const strong = VPS.filter(v => v.kw.some(k => s.includes(k)));
      const weakOnly = VPS.filter(v => !strong.includes(v) && (v.weak || []).some(k => s.includes(k)));
      if (!strong.length && !weakOnly.length) return;
      const p = polarity(s, f.mode);
      const add = v => {
        const it = { t:s, f:f.key, k:v.kw.find(k => s.includes(k)) };
        if (p === "pos") res[v.id].pos.push(it);
        else if (p === "neg") res[v.id].neg.push(it);
        else if (p === "mix") { res[v.id].pos.push(it); res[v.id].neg.push(it); }
        else res[v.id].neu.push(it);
      };
      strong.forEach(add);
      /* 物や場所の名前だけ（ブロック・遊び など）は、うまくいった文のときだけ強みとして数える */
      if (p === "pos" || p === "mix") weakOnly.forEach(v => res[v.id].pos.push({ t:s, f:f.key, k:v.weak.find(k => s.includes(k)) }));

  const an = analyze(rec.input), marks = rec.marks || {};

    const vps = VPS.filter(v => v.d === D.key);
    const s = [], k = [], c = [];
    vps.forEach(v => { const m = marks[v.id] || {}; if (m.s) s.push(v); if (m.k) k.push(v); if (m.c) c.push(v); });
    const negW = v => an[v.id].neg.reduce((n, e) => n + (e.f === "difficulties" ? 3 : 1), 0);
    const byNeg = (a, b) => negW(b) - negW(a);
    const byPos = (a, b) => an[b.id].pos.length - an[a.id].pos.length;
    k.sort(byNeg); s.sort(byPos);
    const seen = new Set(), ev = [];
    const push = (it, type) => { if (seen.has(it.t)) return; seen.add(it.t); ev.push({ ...it, type }); };
    vps.forEach(v => an[v.id].neg.forEach(it => push(it, "neg")));
    vps.forEach(v => an[v.id].pos.forEach(it => push(it, "pos")));
    vps.forEach(v => an[v.id].neu.forEach(it => push(it, "neu")));
    doms[D.key] = { D, s, k, c, ev, score:k.length * 3 + c.length + s.length, has:(s.length + k.length + c.length) > 0 };
  });
  const ranked = DOMAINS.map(D => doms[D.key]).filter(x => x.score > 0)
    .sort((a, b) => b.score - a.score || b.k.length - a.k.length || b.ev.length - a.ev.length);
  const kList = [], sList = [], cList = [];
  ranked.forEach(dd => { kList.push(...dd.k); sList.push(...dd.s); cList.push(...dd.c); });
  return { an, doms, ranked, main:ranked[0] || null, related:ranked.slice(1), kList, sList, cList };
}

/* ---------- ブレインジム・BBA の提案 ---------- */
const safetyOf = inp => ({ seizure:!!(inp && inp.safetySeizure), ear:!!(inp && inp.safetyEar) });

  const m = VP_BGBBA[v.id]; if (!m) return [];
  const ids = type === "bg" ? m.bg : type === "bba" ? m.bba : m.play;
  const out = ids.map(id => ({ id, ...ACTS[id] })).filter(a => a.n && !(a.ear && (safety.seizure || safety.ear)));

const BG_LABEL = { braingym:"ブレインジム", bba:"BBA" };

  const focusVps = dd.k.length ? dd.k.slice(0, 2) : dd.c.length ? dd.c.slice(0, 1) : dd.s.slice(0, 1);
  (ids || []).forEach(id => {
    const s = SUP[id]; if (!s) return;
    const txt = String(s.d[dd.D.key] || "").trim();
    const ov = db.settings.overrides[id];
    if (BG_LABEL[id] && !(ov && ov[dd.D.key] !== undefined) && focusVps.length) {
      const used = new Set();
      const lines = focusVps.map(v => {
        const acts = actsFor(v, id === "braingym" ? "bg" : "bba", safety).filter(a => !used.has(a.id)).slice(0, 2);
        acts.forEach(a => used.add(a.id));
        return acts.length ? `【${BG_LABEL[id]}】「${v.short}」${fromStrength ? "の強みを伸ばすなら" : "に"}\n${acts.map(a => `　・${a.n}：${a.p}`).join("\n")}` : "";
      }).filter(Boolean);
      if (lines.length) { L.push(...lines); return; }
    }
    if (txt) L.push(`【${BG_LABEL[id] || s.name}】${txt}`);

  if ((ids || []).some(id => BG_LABEL[id]) && focusVps.length) {

}
function bgSession(inp, X){
  const sel = inp.supports || [], hasBG = sel.includes("braingym"), hasBBA = sel.includes("bba");

  const safety = safetyOf(inp);
  const vps = X.kList.length ? X.kList.slice(0, 2) : (X.cList.length ? X.cList.slice(0, 2) : X.sList.slice(0, 1));
  if (!vps.length) return null;
  const score = { focus:0, centering:0, laterality:0 };
  X.kList.forEach(v => { score[VP_BGBBA[v.id].dim] += 2; });
  X.cList.forEach(v => { score[VP_BGBBA[v.id].dim] += 1; });
  if (!X.kList.length && !X.cList.length) X.sList.forEach(v => { score[VP_BGBBA[v.id].dim] += 1; });

  const L = [
    `1. ${hasBG ? "PACE" : "準備"}：${pace}`,
    `2. 目標：${v0.goal}（本人と一緒に、ことばや絵で決める）`,
    `3. プレ・アクティビティ：目標に関わる活動を少しやってみて、からだ・気持ち・考えの様子に気づく`,

  else if (safety.ear) notes.push("風邪・鼻づまり・耳の治療中のため、耳ポッピングは提案から外しています。");

function factRows(inp, X){

function facField(d, E){
  const facs = facList();
  if (facs.length && d.facilityId !== "__new" && !facById(d.facilityId)) d.facilityId = curFac().id;
  const isNew = !facs.length || d.facilityId === "__new";
  const sel = isNew ? null : facById(d.facilityId);
  const typeOpts = cur => FAC_TYPES.map(t => `<option ${cur === t ? "selected" : ""}>${t}</option>`).join("");
  if (state.facEdit && sel) return `<div class="field span2">
    <label for="fe-name">事業所名を直す</label>
    <div class="facnew"><input type="text" id="fe-name" value="${esc(sel.name)}"><select id="fe-type" aria-label="事業所の種類"><option value="">種類を選ぶ（任意）</option>${typeOpts(sel.type)}</select></div>
    <div class="row" style="margin-top:8px"><button type="button" class="btn btn-sm btn-main" data-act="fac-save" data-id="${sel.id}">保存する</button><button type="button" class="btn btn-sm" data-act="fac-cancel">やめる</button><span class="small muted">保存した記録の事業所名も、新しい名前になります。</span></div>
  </div>`;
  return `<div class="field span2 ${E.fac ? "has-err" : ""}">
    <label for="${facs.length ? "f-fac" : "f-facname"}">事業所名 <span class="req">必須</span><span class="hint">一度入れると、次からは自動で入ります</span></label>
    ${facs.length ? `<div class="facpick-row"><select id="f-fac" data-facpick>${facs.map(f => `<option value="${f.id}" ${d.facilityId === f.id ? "selected" : ""}>${esc(facLabel(f))}</option>`).join("")}<option value="__new" ${isNew ? "selected" : ""}>＋ 新しい事業所を追加する</option></select>${sel ? `<button type="button" class="btn btn-sm" data-act="fac-edit">${ART.icon("pen")}名前を直す</button><button type="button" class="btn btn-sm btn-danger" data-act="fac-del" data-id="${sel.id}">${ART.icon("trash")}削除</button>` : ""}</div>` : ""}

      <input type="text" id="f-facname" data-f="newFacName" value="${esc(d.newFacName || "")}" placeholder="例：ひだまり" autocomplete="organization">
      <select id="f-factype" data-f="newFacType" aria-label="事業所の種類"><option value="">種類を選ぶ（任意）</option>${typeOpts(d.newFacType)}</select>
    </div>

  </div>`;
}

/* =========================================================

function historyData(){
  const cf = curFac(), facFilter = state.hFac === "all" || !cf ? null : cf.id;
  const all = db.records.filter(r => !facFilter || r.input.facilityId === facFilter).sort((a, b) => String(b.input.date || "").localeCompare(String(a.input.date || "")) || (b.updatedAt || 0) - (a.updatedAt || 0));
  const q = state.hQuery.trim();
  const list = all.filter(r => (!state.hFilter || r.input.name === state.hFilter) &&
    (!q || [r.input.name, r.input.recorder, r.input.age, ...TEXT_FIELDS.map(f => r.input[f.key])].join(" ").includes(q)));
  return { all, list };
}
function renderHistoryList(){
  const { list } = historyData();
  if (!list.length) return `<div class="card empty"><p>条件に合う記録はありません。</p></div>`;
  const SUP = supMap();
  return `<div class="hlist">${list.map(r => {
    const X = derive(r), mk = (r.confirm && r.confirm.main) || (X.main && X.main.D.key);
    const D = mk ? DMAP[mk] : null, sups = (r.input.supports || []).map(id => SUP[id]).filter(Boolean);
    return `<article class="hcard">
      <div class="hcard-top"><div class="avatar" style="background:${D ? D.c : "var(--sun)"}">${esc((r.input.name || "？").trim().charAt(0))}</div>
        <div style="min-width:0"><h3>${esc(r.input.name)}${r.input.age ? `<span class="small muted" style="font-family:var(--f-body)">　${esc(r.input.age)}</span>` : ""}</h3>
        <p class="hmeta">${facList().length > 1 && recFac(r) ? `${esc(recFac(r).name)}<br>` : ""}記録日 ${esc(fmtDate(r.input.date))}${r.input.periodStart || r.input.periodEnd ? `<br>期間 ${esc(fmtPeriod(r.input.periodStart, r.input.periodEnd))}` : ""}</p></div></div>
      <div class="row" style="gap:6px">${D ? dchip(D.key, true) : `<span class="pill n">領域の候補なし</span>`}${sups.slice(0, 3).map(s => `<span class="pill sup">${esc(s.name.split("（")[0])}</span>`).join("")}${sups.length > 3 ? `<span class="pill n">ほか${sups.length - 3}</span>` : ""}</div>
      <div class="acts">
        <button type="button" class="btn btn-sm btn-main" data-hview="${r.id}">まとめを見る</button>
        <button type="button" class="btn btn-sm" data-hprint="${r.id}">${ART.icon("print")}PDF・印刷</button>
        <button type="button" class="btn btn-sm" data-hedit="${r.id}">入力を直す</button>
        <button type="button" class="btn btn-sm" data-hnext="${r.id}">${ART.icon("plus")}この子の次の記録</button>
        <button type="button" class="btn btn-sm btn-ghost btn-danger" data-hdel="${r.id}">削除</button>
      </div>
    </article>`;
  }).join("")}</div>`;
}

      <div class="row" style="margin-top:12px">

        <label class="btn btn-sm" for="importFile" style="cursor:pointer">${ART.icon("upload")}ファイルから読みこむ</label>
        <input type="file" id="importFile" accept=".json,application/json" class="sr">

  </div>`;
}

function deleteFacility(id){
  const f = facById(id); if (!f) return;
  db.records = db.records.filter(r => r.input.facilityId !== f.id);
  db.settings.facilities = facList().filter(x => x.id !== f.id);
  if (db.settings.currentFacility === f.id) db.settings.currentFacility = facList()[0] ? facList()[0].id : "";
  if (db.draft) {
    if (db.draft.id && !db.records.some(r => r.id === db.draft.id)) db.draft.id = null;
    if (db.draft.facilityId === f.id) db.draft.facilityId = curFac() ? curFac().id : "";
  }
  if (state.currentId && !db.records.some(r => r.id === state.currentId)) state.currentId = null;
  state.hFac = ""; state.facEdit = false;
}
function confirmDeleteFacility(id){
  const f = facById(id); if (!f) return;
  const n = countRecs(f.id);
  confirmBox(`事業所名「${esc(f.name)}」を削除しますか？`
    + (n ? `<br><span class="small" style="color:var(--coral-deep)">この事業所の保存した記録（${n}件）も消えます。</span><br><span class="small muted">名前をまちがえただけなら「名前を直す」を使うと、記録は残ります。</span>`
         : `<br><span class="small muted">削除したあと、正しい事業所名を入れ直せます。</span>`),
    n ? "記録ごと削除する" : "削除する", () => {
      deleteFacility(f.id); persist(); rerenderKeepScroll(); toast("事業所名を削除しました");
    }, true);
}
function saveFacilityEdit(id){
  const f = facById(id); if (!f) return;

  if (!name) { toast("事業所名を入れてください"); $("#fe-name")?.focus(); return; }
  if (facList().some(x => x.id !== f.id && x.name === name)) { toast("同じ名前の事業所がすでにあります"); return; }
  f.name = name; f.type = $("#fe-type")?.value || "";
  db.records.forEach(r => { if (r.input.facilityId === f.id) { r.input.facilityName = f.name; r.input.facilityType = f.type; } });

function resetAll(){
  try { localStorage.removeItem(STORE_KEY); } catch (e) {}
  db = defaultDb(); db.draft = newDraft();

}
function switchFacility(id){
  const f = facById(id); if (!f) return;
  db.settings.currentFacility = f.id;
  state.hFac = ""; state.hFilter = "";
  if (db.draft && !db.draft.id) { db.draft.facilityId = f.id; if (f.recorder && !String(db.draft.recorder || "").trim()) db.draft.recorder = f.recorder; }
  persist();

  rerenderKeepScroll();
  toast(`「${f.name}」に切り替えました`);
}
function startNew(base){
  const doIt = () => { db.draft = newDraft(base || {}); state.formErr = null; persist(); go("form"); };
  const d = db.draft;
  if (d && !d.id && draftHasContent(d)) confirmBox("入力中の内容があります。消して新しい記録をはじめますか？", "新しくはじめる", doIt);
  else doIt();
}
function generate(){
  const d = db.draft;
  const needNewFac = !facList().length || d.facilityId === "__new" || !facById(d.facilityId);
  const err = { fac:needNewFac && !String(d.newFacName || "").trim(), name:!String(d.name || "").trim(), text:!TEXT_FIELDS.some(f => String(d[f.key] || "").trim()) };
  if (err.fac || err.name || err.text) {
    state.formErr = err; render();
    const el = err.fac ? $("#f-facname") : err.name ? $("#f-name") : $("#f-when");
    el?.scrollIntoView({ block:"center", behavior:"smooth" }); el?.focus({ preventScroll:true });
    return;
  }
  state.formErr = null;
  const fac = needNewFac ? addFacility(d.newFacName, d.newFacType) : facById(d.facilityId);
  d.facilityId = fac.id; d.newFacName = ""; d.newFacType = "";
  db.settings.currentFacility = fac.id;
  const input = clone(d); delete input.id; delete input.newFacName; delete input.newFacType;
  input.facilityName = fac.name; input.facilityType = fac.type || "";
  const marks = autoMarks(analyze(input)), now = Date.now();
  let rec = d.id ? db.records.find(r => r.id === d.id) : null;
  if (rec) { rec.input = input; rec.marks = marks; rec.edits = {}; rec.updatedAt = now; }
  else {
    rec = { id:uid(), createdAt:now, updatedAt:now, input, marks, edits:{}, confirm:{ main:"", related:[], by:"", date:"", checks:{} }, next:"", final:{} };
    db.records.push(rec); d.id = rec.id;
  }
  db.settings.recorder = input.recorder || db.settings.recorder;
  if (input.recorder) fac.recorder = input.recorder;
  persist();
  toast("まとめを作りました。自動で保存されています");
  go("result", rec.id);
}
function editInput(rec){
  const doIt = () => { db.draft = { ...clone(rec.input), id:rec.id }; state.formErr = null; persist(); go("form"); };
  const d = db.draft;
  if (d && d.id !== rec.id && !d.id && draftHasContent(d)) confirmBox("入力中の内容があります。この記録の内容に置きかえますか？", "置きかえる", doIt);
  else doIt();
}
function printRecord(){
  const rec = currentRecord(); if (!rec) return;
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  const old = document.title;
  const safe = s => String(s || "").replace(/[\\/:*?"<>|\s]/g, "");
  document.title = `五領域アセスメント_${safe(rec.input.name) || "記録"}_${rec.input.date || todayISO()}`;
  document.body.classList.toggle("print-p1", !!db.settings.printP1);
  const restore = () => { document.title = old; window.removeEventListener("afterprint", restore); };
  window.addEventListener("afterprint", restore);
  setTimeout(() => { try { window.print(); } catch (e) { toast("この環境では印刷画面を開けませんでした。ブラウザで開き直してください"); } setTimeout(restore, 1500); }, 60);
}
function addSupport(prefix, selectInDraft){
  const name = ($(`#${prefix}-name`)?.value || "").trim();
  if (!name) { toast("支援の名前を入れてください"); $(`#${prefix}-name`)?.focus(); return; }
  const d = {}; DOMAINS.forEach(D => { d[D.key] = ($(`#${prefix}-${D.key}`)?.value || "").trim(); });
  if (!Object.values(d).some(Boolean)) { toast("どれか1つの領域に、行うことを書いてください"); $(`#${prefix}-kenko`)?.focus(); return; }
  const s = { id:"c_" + uid(), name, desc:($(`#${prefix}-desc`)?.value || "").trim(), d };
  db.settings.custom.push(s);
  if (!db.settings.selected.includes(s.id)) db.settings.selected.push(s.id);
  if (selectInDraft && db.draft && !db.draft.supports.includes(s.id)) db.draft.supports.push(s.id);

}
function exportBackup(onlyFac){
  try {
    const f = onlyFac ? curFac() : null;
    const settings = f ? { ...db.settings, facilities:[f], currentFacility:f.id } : db.settings;
    const records = f ? db.records.filter(r => r.input.facilityId === f.id) : db.records;
    const blob = new Blob([JSON.stringify({ app:"goryoiki-assessment", version:2, exportedAt:new Date().toISOString(), settings, records }, null, 2)], { type:"application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `五領域アセスメント_バックアップ_${f ? f.name.replace(/[\\/:*?"<>|\s]/g, "") + "_" : ""}${todayISO()}.json`;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
    toast("バックアップファイルを保存しました");
  } catch (e) { toast("ファイルを保存できませんでした"); }
}
function importBackup(file){
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const data = JSON.parse(fr.result);
      if (!data || !Array.isArray(data.records)) throw new Error("bad");
      /* 事業所：同じ名前はひとつにまとめる */
      const idMap = {};
      ((data.settings && data.settings.facilities) || []).forEach(f => {
        if (!f || !f.id || !f.name) return;
        const ex = facById(f.id) || facList().find(x => x.name === f.name);
        if (ex) idMap[f.id] = ex.id;
        else { facList().push({ id:f.id, name:f.name, type:f.type || "", recorder:f.recorder || "" }); idMap[f.id] = f.id; }
      });
      if (!db.settings.currentFacility && facList().length) db.settings.currentFacility = facList()[0].id;
      let n = 0;
      data.records.forEach(r => {
        if (!r || !r.id || !r.input) return;
        if (r.input.facilityId && idMap[r.input.facilityId]) r.input.facilityId = idMap[r.input.facilityId];
        if (!r.input.facilityId && curFac()) { r.input.facilityId = curFac().id; r.input.facilityName = curFac().name; }
        const i = db.records.findIndex(x => x.id === r.id);
        if (i >= 0) db.records[i] = r; else db.records.push(r);
        n++;
      });
      if (data.settings && Array.isArray(data.settings.custom)) {
        data.settings.custom.forEach(c => { if (c && c.id && !db.settings.custom.some(x => x.id === c.id)) db.settings.custom.push(c); });
      }
      persist(); render();
      toast(`${n}件の記録を読みこみました`);
    } catch (e) { toast("読みこめませんでした。このアプリで保存したバックアップファイルを選んでください"); }
  };
  fr.readAsText(file);
}

document.addEventListener("click", e => {

    if (ds.modal === "ok" && modalOk) {
      const f = modalOk, opts = {};

    } else closeModal();

  }
  if (ds.go) { go(ds.go); return; }
  if (ds.mark) {
    const rec = currentRecord(); if (!rec) return;
    const [id, k] = ds.mark.split(":");
    const m = rec.marks[id] || (rec.marks[id] = { s:false, k:false, c:false });
    m[k] = !m[k]; rec.updatedAt = Date.now();
    persist(); rerenderKeepScroll(); return;
  }

  }
  if (ds.facuse) { switchFacility(ds.facuse); return; }

    persistSoon(); return;
  }
  if (ds.edit !== undefined && t.hasAttribute("data-edit")) {
    const rec = currentRecord(); if (!rec) return;
    rec.edits[ds.edit] = t.innerText.replace(/\n$/, "");
    rec.updatedAt = Date.now();
    if (ds.edit === "plan.oneline") { const g = $("#gl-plan"); if (g) g.textContent = rec.edits[ds.edit]; }
    persistSoon(); return;
  }
  if (ds.supedit) {
    const [id, key] = ds.supedit.split("|");
    const c = db.settings.custom.find(x => x.id === id);
    if (c) c.d[key] = t.value;
    else {
      const p = PRESET_SUPPORTS.find(x => x.id === id); if (!p) return;
      const o = db.settings.overrides[id] || (db.settings.overrides[id] = {});
      if (t.value === p.d[key]) delete o[key]; else o[key] = t.value;
      if (!Object.keys(o).length) delete db.settings.overrides[id];
    }
    persistSoon(); return;
  }
  if (ds.facname) {
    const f = facById(ds.facname);
    if (f && t.value.trim()) {
      f.name = t.value.trim();
      db.records.forEach(r => { if (r.input.facilityId === f.id) r.input.facilityName = f.name; });
      persistSoon(); renderFacbar();
    }
    return;
  }
  if (ds.supname) { const c = db.settings.custom.find(x => x.id === ds.supname); if (c) { c.name = t.value; persistSoon(); } return; }
  if (ds.conf && t.type === "text") { const rec = currentRecord(); if (rec) { rec.confirm[ds.conf] = t.value; persistSoon(); } return; }
  if (t.id === "hq") { state.hQuery = t.value; const h = $("#hresults"); if (h) h.innerHTML = renderHistoryList(); }
});

document.addEventListener("change", e => {
  const t = e.target, ds = t.dataset;
  if (ds.scene && db.draft) {
    const s = new Set(db.draft.scenes); t.checked ? s.add(ds.scene) : s.delete(ds.scene);
    db.draft.scenes = SCENES.filter(x => s.has(x));
    if (ds.scene === "その他") $("#f-sceneOther")?.classList.toggle("hidden", !t.checked);
    persistSoon(); return;
  }
  if (ds.facpick !== undefined && t.hasAttribute("data-facpick") && db.draft) {
    db.draft.facilityId = t.value;
    if (t.value !== "__new") {
      db.settings.currentFacility = t.value;
      const f = facById(t.value);
      if (f && f.recorder && !String(db.draft.recorder || "").trim()) db.draft.recorder = f.recorder;
    }
    persist(); rerenderKeepScroll();
    if (t.value === "__new") $("#f-facname")?.focus();
    return;
  }
  if (ds.factype) { const f = facById(ds.factype); if (f) { f.type = t.value; persist(); renderFacbar(); } return; }
  if (t.id === "facSwitch") { switchFacility(t.value); return; }
  if (t.id === "hfac") { state.hFac = t.value; render(); return; }
  if (ds.safety && db.draft) { db.draft[ds.safety] = t.checked; persistSoon(); return; }
  if (ds.sup && db.draft) {
    const s = new Set(db.draft.supports); t.checked ? s.add(ds.sup) : s.delete(ds.sup);
    db.draft.supports = allSupports().map(x => x.id).filter(id => s.has(id));
    persistSoon(); return;
  }
  if (ds.sel) {
    const s = new Set(db.settings.selected); t.checked ? s.add(ds.sel) : s.delete(ds.sel);
    db.settings.selected = allSupports().map(x => x.id).filter(id => s.has(id));
    const card = t.closest(".scard"); card?.classList.toggle("on", t.checked);
    const lab = card?.querySelector(".tlabel"); if (lab) lab.textContent = t.checked ? "使う" : "使わない";
    if (db.draft && !db.draft.id && !draftHasContent(db.draft)) db.draft.supports = [...db.settings.selected];
    persistSoon(); return;
  }
  const rec = currentRecord();
  if (ds.conf && rec) {
    rec.confirm[ds.conf] = t.value; persist();
    const pv = t.closest(".field")?.querySelector(".pv");
    if (pv && ds.conf !== "main") pv.textContent = [rec.confirm.by, fmtDate(rec.confirm.date, false)].filter(Boolean).join("　");
    if (ds.conf === "main") rerenderKeepScroll();
    return;
  }
  if (ds.confRel && rec) {
    const s = new Set(rec.confirm.related || []); t.checked ? s.add(ds.confRel) : s.delete(ds.confRel);
    rec.confirm.related = DOMAINS.map(D => D.key).filter(k => s.has(k)); persist(); rerenderKeepScroll(); return;
  }
  if (ds.chk && rec) { rec.confirm.checks = rec.confirm.checks || {}; rec.confirm.checks[ds.chk] = t.checked; persist(); return; }
  if (ds.next && rec) { rec.next = ds.next; persist(); return; }
  if (ds.final && rec) { rec.final[ds.final] = t.checked; persist(); return; }
  if (t.classList.contains("p1opt")) {
    db.settings.printP1 = t.checked; $$(".p1opt").forEach(x => { x.checked = t.checked; }); persist(); return;
  }
  if (t.id === "hfilter") { state.hFilter = t.value; render(); return; }
  if (t.id === "importFile" && t.files && t.files[0]) { importBackup(t.files[0]); t.value = ""; }
});

/* 書きかえ欄への貼りつけは文字だけにする */
document.addEventListener("paste", e => {
  const t = e.target.closest && e.target.closest("[data-edit]");
  if (!t || CE === "plaintext-only") return;
  e.preventDefault();
  const text = (e.clipboardData || window.clipboardData).getData("text");
  document.execCommand("insertText", false, text);
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#modalHost").innerHTML) closeModal(); });
window.addEventListener("beforeprint", () => { if (state.view === "result") document.body.classList.toggle("print-p1", !!db.settings.printP1); });

/* =========================================================
   はじまり
   ========================================================= */
load();
$("#heroArt").innerHTML = ART.hero();
if (!db.draft) db.draft = newDraft();
state.view = db.settings.setupDone ? "form" : "supports";
render();
</script>
</body>
</html>
