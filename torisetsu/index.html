<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4E2CF">
<meta name="description" content="質問に答えるだけで、お子さんの取扱説明書がA4一枚にまとまります。保護者用と支援者・先生用があり、面談、引き継ぎ、新しい先生や祖父母への説明に使えます。">
<title>子どものトリセツ</title>
<meta property="og:type" content="website">
<meta property="og:title" content="子どものトリセツ｜A4一枚のサポートブック">
<meta property="og:description" content="質問にタップで答えるだけで、お子さんの取扱説明書がA4一枚に。保護者用と支援者・先生用があります。記録はお使いの端末の中だけに保存されます。">
<meta property="og:url" content="https://hohoemi2018.github.io/goryoiki/torisetsu/">
<meta property="og:image" content="https://hohoemi2018.github.io/goryoiki/torisetsu/ogp.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/*
  子どものトリセツ（A4一枚のサポートブック） ― 発達支援ほほえみ
  選択肢を変えたいときは、ファイル後半のスクリプト内の OPTS を書きかえてください。
  保護者用・支援者用で変わる言葉は、スクリプト内の MODE にまとめてあります。
  イラストはすべてこのファイル内のオリジナルSVG（body直後の symbol）です。
*/
:root{
  --bg:#FAF6F0;--ink:#3A322D;--muted:#776B61;--line:#E6DCCF;--apricot:#F4E2CF;
  --orange:#D4782A;--green:#2E8B6A;--blue:#2B5FA8;--amber:#B07E1F;--rose:#C4554D;
  --round:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic","Noto Sans CJK JP",sans-serif;
  --mincho:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP",serif;
  color-scheme:light;
}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.7 var(--round);-webkit-text-size-adjust:100%;overflow-x:clip}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.wrap.wide{max-width:900px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:10px 22px;border-radius:999px;border:2px solid transparent;font-weight:700;font-size:16px;line-height:1.3;text-align:center}
.btn.primary{background:var(--orange);color:#fff;box-shadow:0 3px 0 #A95A17}
.btn.primary:active{transform:translateY(2px);box-shadow:0 1px 0 #A95A17}
.btn.ghost{background:#fff;border-color:var(--line)}
.btn.small{min-height:44px;padding:8px 16px;font-size:15px}
.btn.danger{background:var(--rose);color:#fff}
.btn.p-green{background:#2E8B6A;color:#fff;box-shadow:0 3px 0 #1F6A50}
.btn.p-blue{background:#2B5FA8;color:#fff;box-shadow:0 3px 0 #1D467F}
.btn.p-green:active,.btn.p-blue:active{transform:translateY(2px);box-shadow:none}
.link{background:none;border:0;padding:8px 4px;min-height:44px;color:var(--muted);font-weight:700;font-size:15px;white-space:nowrap}

/* ホーム */
.hero{background:var(--apricot);padding:max(28px,env(safe-area-inset-top)) 0 40px;overflow:hidden}
.hero-in{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:32px;align-items:center}
.brand{margin:0 0 6px;font-size:13px;font-weight:700;color:#9A5A22;letter-spacing:.06em}
.hero h1{margin:0;font-family:var(--mincho);font-weight:700;font-size:clamp(40px,8vw,54px);line-height:1.1;color:#3A2A20}
.subt{display:inline-block;margin:12px 0 0;padding:3px 14px;background:#fff;border-radius:999px;font-size:14px;font-weight:700;color:#9A5A22}
.lead{margin:14px 0 18px}
.modes{display:grid;gap:10px}
.mode{display:grid;grid-template-columns:84px minmax(0,1fr);gap:6px 14px;align-items:center;background:#fff;border-radius:18px;padding:12px 16px 12px 12px;box-shadow:0 2px 0 rgba(120,70,30,.08)}
.mode-ill{grid-row:span 2;width:84px;height:64px}
.mode-tx b{display:block;font-size:18px;line-height:1.35}
.m-parent .mode-tx b{color:#21694F}
.m-staff .mode-tx b{color:#1F4985}
.mode-tx span{display:block;font-size:13.5px;line-height:1.55;color:var(--muted)}
.mode-btns{display:flex;flex-wrap:wrap;align-items:center;gap:2px 12px}
.time{margin:12px 0 0;font-size:13px;color:#86684F}
.thumb-box{position:relative;justify-self:center;width:100%;max-width:290px}
.thumb{position:relative;width:100%;cursor:pointer;transform:rotate(2deg);border-radius:3px;box-shadow:0 16px 32px rgba(120,70,30,.22),0 2px 6px rgba(120,70,30,.14);overflow:hidden;background:#fff}
.thumb-tag{position:absolute;right:10px;bottom:10px;background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:3px 12px;border-radius:999px}
.kid{position:absolute;left:-38px;bottom:-24px;width:88px;height:121px;z-index:2;pointer-events:none}
.fl-star{position:absolute;right:-18px;top:-20px;width:54px;height:54px;z-index:2;pointer-events:none;animation:float 3.4s ease-in-out infinite}
.fl-heart{position:absolute;left:-26px;top:22%;width:32px;height:32px;z-index:2;pointer-events:none;transform:rotate(-14deg)}
@keyframes float{50%{transform:translateY(-6px) rotate(8deg)}}
.sec-h{font-size:19px;margin:34px 0 12px}
.plist{display:grid;gap:10px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.pcard.del{border-color:var(--rose);background:#FFF7F6}
.pn{flex:1 1 200px;font-weight:700;font-size:17px;line-height:1.45}
.pm{display:block;font-size:13px;color:var(--muted);font-weight:500}
.pb{display:flex;flex-wrap:wrap;gap:8px}
.badge{display:inline-block;margin-right:8px;padding:1px 10px;border-radius:999px;font-size:12px;font-weight:700;vertical-align:2px}
.b-parent{background:#E4F3EC;color:#21694F}
.b-staff{background:#E8F0FA;color:#1F4985}
.empty-st{background:#fff;border:1.5px dashed var(--line);border-radius:16px;padding:18px 20px;color:var(--muted);text-align:center;font-size:15px}
.empty-st p{margin:6px 0 0}
.es-kid{width:52px;height:72px}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0;padding:0;list-style:none}
.how li{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.how .n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--orange);color:#fff;font-size:14px;font-weight:700}
.how b{display:block;margin:6px 0 2px}
.how span{font-size:14px;color:var(--muted)}
.care{display:flex;gap:10px;align-items:flex-start;background:#E6F3EC;color:#24553F;border-radius:14px;padding:12px 16px;font-size:14px;margin:18px 0 0}
.ci{flex:none;width:28px;height:28px}
.note{font-size:13.5px;color:var(--muted);margin:14px 0 0}
.note.warn{color:#9C3E37}
.foot{text-align:center;font-size:12.5px;color:var(--muted);padding:36px 0 calc(28px + env(safe-area-inset-bottom))}

/* 入力画面 */
.topbar{position:sticky;top:0;z-index:5;background:rgba(250,246,240,.95);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.tb-in{display:flex;align-items:center;gap:8px;min-height:52px}
.tb-title{flex:1;text-align:center;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-side{min-width:72px;text-align:right;font-size:12.5px;color:var(--green);white-space:nowrap}
.saved-ind{opacity:0;transition:opacity .3s}
.saved-ind.show{opacity:1}
.pills{position:relative;display:flex;gap:6px;overflow-x:auto;padding:10px 16px 8px;max-width:780px;margin:0 auto;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;min-height:40px;padding:6px 13px;border:1.5px solid var(--line);background:#fff;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted)}
.pill.done{color:var(--ink)}
.pill.done::before{content:"✓ ";color:var(--green)}
.pill.cur{background:var(--ink);border-color:var(--ink);color:#fff}
.pill.cur::before{color:#9FE0C4}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--orange);transition:width .3s}
.q{padding:18px 0 130px}
.q[data-c=orange]{--c:#D4782A;--t:#FCEDDF;--d:#A3561A}
.q[data-c=blue]{--c:#2B5FA8;--t:#E8F0FA;--d:#1F4985}
.q[data-c=amber]{--c:#B07E1F;--t:#FAF0D9;--d:#84601A}
.q[data-c=green]{--c:#2E8B6A;--t:#E4F3EC;--d:#21694F}
.q[data-c=rose]{--c:#C4554D;--t:#FBE9E7;--d:#9C3E37}
.qhead{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.qicon{flex:none;display:grid;place-items:center;width:68px;height:68px;border-radius:50%;background:var(--t)}
.qicon svg{width:48px;height:48px}
.qno{margin:0;font-size:13px;font-weight:700;color:var(--d)}
.qmode{display:inline-block;margin-left:8px;padding:0 9px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--muted);font-size:12px}
.q h2{margin:2px 0 0;font-size:clamp(20px,5.2vw,26px);line-height:1.4;text-wrap:balance}
.help{margin:0 0 8px;color:var(--muted);font-size:15px}
.order{margin:0 0 6px;font-size:13.5px;color:var(--d);background:var(--t);border-radius:10px;padding:8px 12px}
.gh{font-size:14px;margin:18px 0 8px;color:var(--d)}
.gh.big{font-size:17px;color:var(--ink);margin-top:26px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipw{display:inline-flex;align-items:center;max-width:100%}
.chip{display:inline-flex;align-items:center;gap:7px;max-width:100%;min-height:44px;padding:8px 15px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:15px;font-weight:500;line-height:1.4;text-align:left}
.chip.on{background:var(--t);border-color:var(--c);color:var(--d);font-weight:700}
.chip .no{flex:none;display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;font-size:12px;font-weight:700}
.rm{flex:none;width:40px;height:40px;margin-left:-2px;border:0;border-radius:50%;background:none;color:var(--muted);font-size:19px;line-height:1}
.count{margin:14px 0 0;font-size:13.5px;color:var(--muted)}
.addlab{display:block;margin:20px 0 6px;font-size:14px;font-weight:700}
.addrow{display:flex;gap:8px}
.addrow input,.field input,textarea{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:10px 14px;font-size:16px}
.addrow input{flex:1}
.field{display:block;margin:18px 0 0}
.lab{display:block;font-weight:700;font-size:15px;margin-bottom:6px}
.lab small{font-weight:500;color:var(--muted);font-size:13px;margin-left:6px}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.quick button{min-height:40px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:14px}
textarea{min-height:110px;resize:vertical;line-height:1.6}
.cnt{display:block;text-align:right;font-size:12.5px;color:var(--muted);margin-top:4px}
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.nb-in{display:flex;gap:10px}
.nb-in .primary{flex:1}
.nb-in .ghost{min-width:96px}

/* できあがり画面 */
.pv{padding-top:14px;padding-bottom:calc(48px + env(safe-area-inset-bottom))}
.pv-actions{display:flex;flex-wrap:wrap;gap:10px}
.pv-hint{font-size:13.5px;color:var(--muted);margin:10px 0 0}
.fitnote{font-size:13.5px;margin:8px 0 0;color:var(--muted)}
.fitnote:empty{display:none}
.fitnote.warn{color:#9C3E37;background:#FBE9E7;border-radius:10px;padding:8px 12px}
.sample-note{margin:0 0 10px;font-size:13.5px;color:#86684F}
.stage{position:relative;overflow:hidden;margin-top:16px;filter:drop-shadow(0 8px 18px rgba(80,50,20,.16))}
.sheet-wrap,.thumb-in{width:210mm;transform-origin:top left}

/* A4シート */
.sheet{--fs:1;width:210mm;min-height:297mm;padding:11mm 12mm 10mm;background:#fff;color:#2F2925;font-family:var(--round);font-size:calc(10.5pt*var(--fs));line-height:1.55;display:flex;flex-direction:column;gap:calc(3.2mm*var(--fs));-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet .sh{display:flex;justify-content:space-between;align-items:flex-end;gap:6mm;padding-bottom:2.6mm;border-bottom:.6mm solid #D4782A}
.sheet .sh-l{display:flex;align-items:center;gap:3mm}
.sheet .face{flex:none;width:calc(15mm*var(--fs));height:calc(15mm*var(--fs))}
.sheet .kick{margin:0;font-size:calc(9.5pt*var(--fs));font-weight:700;color:#C0661D;letter-spacing:.06em}
.sheet h1{margin:0;font-family:var(--mincho);font-weight:700;font-size:calc(24pt*var(--fs));line-height:1.2}
.sheet h1 span{color:#C0661D}
.sheet dl{flex:none;margin:0;display:grid;grid-template-columns:auto auto;column-gap:2.4mm;font-size:calc(9pt*var(--fs))}
.sheet dl div{display:contents}
.sheet dt{color:#8A7D72}
.sheet dd{margin:0;font-weight:700}
.ss{break-inside:avoid;background:var(--tint);border:1px solid var(--edge);border-radius:3mm;padding:2.6mm 3.6mm 3mm}
.ss h2{display:flex;align-items:center;gap:1.8mm;margin:0 0 .8mm;font-size:calc(11.5pt*var(--fs));line-height:1.35;color:var(--sc)}
.ss h2 .ic{flex:none;width:calc(5.6mm*var(--fs));height:calc(5.6mm*var(--fs))}
.ss h2+h2,.ss .ls+h2{margin-top:2mm}
.ss .sub{margin:0 0 1.2mm;font-size:calc(8.5pt*var(--fs));color:#7A6E64}
.ls{margin:0;padding:0;list-style:none}
.ls li{position:relative;padding-left:4mm;margin:.3mm 0}
.ls li::before{content:"";position:absolute;left:.5mm;top:.58em;width:1.7mm;height:1.7mm;border-radius:50%;border:.35mm solid var(--sc)}
.tags{display:flex;flex-wrap:wrap;gap:1.6mm;margin:.6mm 0 0;padding:0;list-style:none}
.tags li{background:#fff;border:1px solid var(--edge);border-radius:99px;padding:.2mm 3mm}
.row,.cols{display:grid;gap:3mm}
.cols h3{display:inline-flex;align-items:center;gap:1mm;margin:.6mm 0 .8mm;padding:0 2.6mm 0 1.4mm;font-size:calc(9.5pt*var(--fs));color:var(--sc);background:#fff;border:1px solid var(--edge);border-radius:99px}
.cols h3 .ic2{flex:none;width:calc(4.2mm*var(--fs));height:calc(4.2mm*var(--fs))}
.big{margin:0 0 .6mm;font-weight:700;font-size:calc(12pt*var(--fs))}
.msg{margin:0}
.s-like{--sc:#C0661D;--tint:#FDF3EA;--edge:#F1D5BC}
.s-trig{--sc:#2B5FA8;--tint:#EEF3FA;--edge:#CCDAEE}
.s-sign{--sc:#9A6E15;--tint:#FBF5E6;--edge:#EEDDB3}
.s-good{--sc:#2E8B6A;--tint:#ECF6F1;--edge:#C3E2D5}
.s-ng{--sc:#C4554D;--tint:#FCEFEE;--edge:#F0CCC8}
.s-info{--sc:#4F6480;--tint:#F3F5F8;--edge:#D9DFE8}
.s-msg{--sc:#C0661D;--tint:#fff;--edge:#EBCDB2;border-style:dashed}
.sheet .empty{margin:8mm 0;text-align:center;color:#8A7D72}
.sf{margin-top:auto;padding-top:2mm;text-align:center;font-size:calc(7.5pt*var(--fs));color:#9A8F86}

/* トースト・ダイアログ */
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,16px);width:max-content;max-width:90vw;background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;text-align:center;opacity:0;pointer-events:none;transition:.25s;z-index:30}
#toast.show{opacity:1;transform:translate(-50%,0)}
#modal{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(40,30,25,.45)}
#modal.open{display:flex}
.mbox{width:100%;max-width:440px;max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:26px 22px 22px;text-align:center;animation:pop .35s ease-out}
.mbox h2{margin:0 0 10px;font-family:var(--mincho);font-size:24px}
.m-ill{display:block;width:170px;height:117px;margin:-6px auto 6px}
.praise{margin:0 0 14px;font-size:17px;line-height:1.85}
.tip{margin:0 0 16px;padding:10px 12px;background:var(--bg);border-radius:12px;font-size:13.5px;color:var(--muted);text-align:left}
.mbox textarea{min-height:220px;margin-bottom:14px;font-size:14px}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:600px){
  .hero-in{grid-template-columns:1fr;gap:26px}
  .mode{grid-template-columns:66px minmax(0,1fr);gap:6px 12px}
  .mode-ill{width:66px;height:50px}
  .thumb-box{max-width:230px}
  .kid{left:-30px;bottom:-20px;width:70px;height:96px}
  .fl-star{width:44px;height:44px;right:-14px;top:-16px}
  .fl-heart{width:26px;height:26px;left:-22px}
  .qicon{width:58px;height:58px}
  .qicon svg{width:40px;height:40px}
  .how{grid-template-columns:1fr}
  .nb-in .ghost{min-width:84px}
}

@page{size:A4;margin:10mm 0}
@media print{
  html,body{background:#fff!important}
  .no-print,.topbar,.navbar,#toast,#modal{display:none!important}
  .pv{padding:0!important;margin:0!important;max-width:none!important}
  .stage{height:auto!important;overflow:visible!important;margin:0!important;filter:none!important}
  .sheet-wrap{transform:none!important;margin:0!important}
  .sheet{min-height:0;padding-top:1mm;padding-bottom:0}
  .sheet.fit{height:276.6mm;overflow:hidden}
}
</style>
</head>

let A4=0;
function a4px(){if(!A4){const t=document.createElement('div');t.style.cssText='position:absolute;visibility:hidden;width:1px;height:297mm';document.body.appendChild(t);A4=t.getBoundingClientRect().height;t.remove()}return A4}
function fit(sh){
  const max=a4px()*296/297;let fs=1;
  sh.classList.remove('fit','over');sh.style.minHeight='0';sh.style.setProperty('--fs','1');
  const over=()=>sh.scrollHeight>max;
  if(!over()){
    /* 余白が多いときは、読みやすいように文字を少し大きくする */
    while(fs<1.15){const n=Math.round((fs+0.03)*100)/100;sh.style.setProperty('--fs',String(n));if(over()){sh.style.setProperty('--fs',String(fs));break}fs=n}
  }else{
    while(over()&&fs>0.83){fs=Math.round((fs-0.03)*100)/100;sh.style.setProperty('--fs',String(fs))}
  }
  const ok=sh.scrollHeight<=max;sh.style.minHeight='';sh.classList.add(ok?'fit':'over');
  return {ok,fs};
}
function scaleTo(box,inner){
  const sh=inner&&inner.firstElementChild;if(!sh)return;
  const w=sh.offsetWidth,h=sh.offsetHeight,s=Math.min(1,box.clientWidth/w);
  inner.style.transform=`scale(${s})`;inner.style.marginLeft=Math.max(0,(box.clientWidth-w*s)/2)+'px';box.style.height=Math.ceil(h*s)+'px';
}
function layout(){
  if(view==='home'){const t=document.querySelector('.thumb');if(t){fit(t.querySelector('.sheet'));scaleTo(t,t.firstElementChild)}}
  if(view==='preview'||view==='sample'){
    const st=document.getElementById('stage');if(!st)return;
    const r=fit(st.querySelector('.sheet'));scaleTo(st,st.firstElementChild);
    const fn=document.getElementById('fitnote');
    if(fn){
      if(!r.ok){fn.className='fitnote warn no-print';fn.textContent='A4一枚に収まりきらず、2枚に分かれることがあります。各項目を5つ前後にしぼると、1枚にきれいに収まります。'}
      else if(r.fs<0.94){fn.className='fitnote no-print';fn.textContent='A4一枚に収めるため、文字を少し小さくしています。'}
      else fn.textContent='';
    }
  }
}

  <div class="wrap"><div class="bar"><span style="width:${(step+1)/STEPS.length*100}%"></span></div></div>
  <main class="wrap"><section class="q" data-c="${s.c}">${body}</section></main>
  <div class="navbar"><div class="wrap nb-in"><button type="button" class="btn ghost" data-act="prev">${step===0?'ホーム':'戻る'}</button><button type="button" class="btn primary" data-act="next">${step===STEPS.length-1?'トリセツを見る':'次へ'}</button></div></div>`;
}
function previewHTML(){
  const sample=view==='sample',m=curMode(),M=MODE[m],d=sample?SAMPLES[m]:cur.d;
  return `${sample?topbar(`見本：${M.label}`,'home','‹ もどる',' '):topbar(`${esc(nm(d))}のトリセツ`,'edit','‹ 入力を直す','<button class="link" data-act="home">ホーム</button>')}
  <main class="wrap wide pv">
    ${sample?`<p class="sample-note no-print">これは${M.label}の見本です（架空のお子さんの例）。</p>`:''}
    <div class="pv-actions no-print"><button type="button" class="btn primary" data-act="print">印刷・PDF保存</button><button type="button" class="btn ghost" data-act="copy">文章でコピー</button>${sample?`<button type="button" class="btn ghost" data-act="new" data-mode="${m}">${M.label}で作る</button>`:''}</div>
    <p class="pv-hint no-print">PDFにするときは、印刷画面の送信先（プリンター）で「PDFに保存」を選んでください。文章でコピーすると、LINEやメールにそのまま貼れます。</p>
    ${inFrame?'<p class="fitnote warn no-print">この画面の中では印刷ボタンが動かないことがあります。ブラウザで直接ひらいてお使いください。</p>':''}
    <p class="fitnote no-print" id="fitnote"></p>
    <div class="stage" id="stage"><div class="sheet-wrap">${sheetHTML(d,m)}</div></div>
  </main>`;
}
function render(){
  if((view==='wizard'||view==='preview')&&!cur)view='home';
  document.getElementById('app').innerHTML=view==='home'?homeHTML():view==='wizard'?wizardHTML():previewHTML();
  layout();
  if(view==='wizard'){const c=document.getElementById('pills'),p=c&&c.querySelector('.pill.cur');if(p)c.scrollLeft=p.offsetLeft-c.clientWidth/2+p.offsetWidth/2}
}
function go(v){view=v;render();window.scrollTo(0,0)}
function updPill(){const p=document.querySelector(`.pill[data-i="${step}"]`);if(p)p.classList.toggle('done',stepDone(step))}
function reOpts(f){const el=document.getElementById('ob-'+f);if(el)el.outerHTML=optBlock(f);updPill()}
function addCustom(f){
  const inp=document.getElementById('add-'+f);if(!inp||!cur)return;
  const v=inp.value.replace(/\s+/g,' ').trim().slice(0,40);if(!v){inp.focus();return}
  const preset=OPTS[f].some(g=>g.items.includes(v)),c=cur.d.custom[f]=cur.d.custom[f]||[];
  if(!preset&&!c.includes(v))c.push(v);
  if(!cur.d[f].includes(v))cur.d[f].push(v);
  inp.value='';touch();reOpts(f);toast(`「${v}」を追加しました`);
}

/* ===== コピー・印刷・メッセージ ===== */
function buildText(d,m){
  const M=MODE[mode(m)],L=[`【${nm(d)}のトリセツ】`];
  const meta=[d.age,d.writer&&('記入：'+d.writer),d.place,fmtDate(d.date)].filter(Boolean).join('／');if(meta)L.push(meta);
  const add=(t,a)=>{if(a.length){L.push('','■'+t);a.forEach(x=>L.push('・'+x))}};
  add('好きなこと・得意なこと',d.likes);
  add('苦手なこと（かんしゃくのきっかけになりやすいこと）',d.triggers);
  add('かんしゃくの前のサイン',d.signs);
  if(d.prevent.length||d.during.length||d.after.length){L.push('','■効く対応');[['前もって',d.prevent],['かんしゃくのとき',d.during],['落ち着いたら',d.after]].forEach(([t,a])=>{if(a.length){L.push(`〈${t}〉`);a.forEach(x=>L.push('・'+x))}})}
  add('しないでほしいこと（逆効果になりやすい対応）',d.ng);
  if(d.calm)L.push('','■落ち着くまでの目安',d.calm);
  add(M.contact[0],d.contact);
  if(d.message.trim())L.push('','■ひとこと',d.message.trim());
  return L.join('\n');
}
async function copyText(t){
  const done=()=>toast('コピーしました。LINEやメールに貼りつけられます');
  try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t);done();return}}catch(e){}
  try{const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,t.length);const ok=document.execCommand('copy');ta.remove();if(ok){done();return}}catch(e){}
  openModal(`<h2>文章をコピー</h2><p class="tip">自動でコピーできませんでした。下の文章を長押し（またはすべて選択）して、コピーしてください。</p><textarea id="manualCopy" readonly>${esc(t)}</textarea><button type="button" class="btn primary" data-act="close">とじる</button>`);
  const mc=document.getElementById('manualCopy');if(mc){mc.focus();mc.select()}
}
function doPrint(){layout();printing=true;try{window.print()}catch(e){printing=false;toast('印刷できませんでした。ブラウザで直接ひらいてお使いください')}}
function praise(){
  const M=MODE[curMode()],n=view==='sample'?'ゆうくん':nm(cur?cur.d:SAMPLES.parent);
  const msg=M.praise[Math.floor(Math.random()*M.praise.length)](n);
  openModal(`<svg class="m-ill" viewBox="0 0 170 117" aria-hidden="true"><use href="#i-kid" x="45" y="2" width="80" height="110"/><use href="#i-star" x="122" y="4" width="38" height="38"/><use href="#i-heart" x="12" y="34" width="30" height="30"/></svg><h2>おつかれさまでした</h2><p class="praise">${esc(msg)}</p><p class="tip">${M.tip}</p><button type="button" class="btn primary" data-act="close">とじる</button>`);
}
const modal=document.getElementById('modal'),toastEl=document.getElementById('toast');let tt;
function openModal(h){modal.innerHTML=`<div class="mbox" role="dialog" aria-modal="true">${h}</div>`;modal.classList.add('open');const b=modal.querySelector('.btn');if(b&&!modal.querySelector('textarea'))b.focus()}
function closeModal(){modal.classList.remove('open');modal.innerHTML=''}
function toast(m){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove('show'),2400)}

/* ===== 操作 ===== */
document.addEventListener('click',e=>{
  if(e.target===modal){closeModal();return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id,f=b.dataset.field,v=b.dataset.val;
  const find=()=>db.profiles.find(p=>p.id===id);
  switch(a){
    case 'new':{const p={id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),mode:mode(b.dataset.mode),created:Date.now(),updated:Date.now(),d:blank()};db.profiles.push(p);persist();cur=p;step=0;go('wizard');break}
    case 'sample':sampleMode=mode(b.dataset.mode);go('sample');break;
    case 'home':cur=null;pendingDel=null;go('home');break;
    case 'open':{const p=find();if(p){cur=p;go('preview')}break}
    case 'edit':{if(id){const p=find();if(!p)break;cur=p;step=0}go('wizard');break}
    case 'del':pendingDel=id;render();break;
    case 'delno':pendingDel=null;render();break;
    case 'delyes':db.profiles=db.profiles.filter(p=>p.id!==id);pendingDel=null;persist();render();toast('削除しました');break;
    case 'step':step=+b.dataset.i;go('wizard');break;
    case 'prev':if(step>0){step--;go('wizard')}else{cur=null;go('home')}break;
    case 'next':if(step<STEPS.length-1){step++;go('wizard')}else go('preview');break;
    case 'toggle':{const arr=cur.d[f],i=arr.indexOf(v);if(i>=0)arr.splice(i,1);else arr.push(v);touch();reOpts(f);break}
    case 'add':addCustom(f);break;
    case 'rmc':cur.d.custom[f]=(cur.d.custom[f]||[]).filter(x=>x!==v);cur.d[f]=cur.d[f].filter(x=>x!==v);touch();reOpts(f);break;
    case 'calm':cur.d.calm=cur.d.calm===v?'':v;touch();document.getElementById('ob-calm').outerHTML=calmBlock();updPill();break;
    case 'writer':{cur.d.writer=v;const w=document.getElementById('f-writer');if(w)w.value=v;touch();break}
    case 'print':doPrint();break;
    case 'copy':copyText(buildText(view==='sample'?SAMPLES[sampleMode]:cur.d,curMode()));break;
    case 'close':closeModal();break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target,f=t.dataset&&t.dataset.f;if(!f||!cur)return;
  cur.d[f]=t.value;touch();
  if(f==='name'){const tb=document.getElementById('tbName');if(tb)tb.textContent=nm(cur.d)+'のトリセツ'}
  if(f==='message'){const c=document.getElementById('msgCnt');if(c)c.textContent=t.value.length+' / 150'}
  updPill();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&modal.classList.contains('open')){closeModal();return}
  const t=e.target;
  if(e.key==='Enter'&&t.classList&&t.classList.contains('add-in')){if(e.isComposing||e.keyCode===229)return;e.preventDefault();addCustom(t.dataset.field);return}
  if((e.key==='Enter'||e.key===' ')&&t.getAttribute&&t.getAttribute('role')==='button'){e.preventDefault();t.click()}
});
window.addEventListener('beforeprint',layout);
window.addEventListener('afterprint',()=>{if(printing){printing=false;setTimeout(praise,250)}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(layout,120)});

load();render();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(layout);
}

</script>
</body>
</html>
